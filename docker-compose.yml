version: '3.9'

services:
  proxy:
    build: ./proxy
    ports:
      - '80:80'
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - PORT=4000
      - NODE_ENV=production
    depends_on: []
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    driver: bridge
